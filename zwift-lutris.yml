name: Zwift
game_slug: zwift
version: Windows (dw-proton)
slug: zwift-dwproton
runner: wine

# Lutris runs dw-proton as a Proton build through umu. With GAMEID umu-zwift,
# Proton applies the Zwift protonfix on first run: it sets PROTON_DLL_COPY and
# installs corefonts, dotnet48, d3dcompiler_47 and webview2. ZwiftStart.exe
# handles updates, the fullscreen default and starting ZwiftApp.exe as a child
# process of the launcher.
# Source and instructions: https://github.com/smoebody/lutris-zwift
script:
  files:
    - setup:
        url: https://cdn.zwift.com/app/ZwiftSetup.exe
        filename: ZwiftSetup.exe
        referer: https://www.zwift.com
    - zwiftstart:
        url: https://github.com/smoebody/lutris-zwift/releases/download/release/0.2.0/ZwiftStart.exe
        filename: ZwiftStart.exe
        checksum: sha256:b990b095a4f204c4a356fd212f87204dab5211eb6d1fb364d89af81345aa3c7a

  game:
    arch: win64
    prefix: $GAMEDIR
    exe: $GAMEDIR/drive_c/Program Files (x86)/Zwift/ZwiftStart.exe
    working_dir: $GAMEDIR/drive_c/Program Files (x86)/Zwift

  wine:
    version: dw-proton

  # Otherwise Lutris 0.5.22 uses the global Wine default (PROTONPATH=GE-Proton)
  # for wineexec steps, and PROTON_VERB=runinprefix after create_prefix, which
  # skips the protonfix. Lutris does not override values set here.
  system:
    env:
      PROTONPATH: $HOME/.local/share/lutris/runners/wine/dw-proton-x86_64
      PROTON_VERB: waitforexitandrun
      GAMEID: umu-zwift
      UMU_ID: umu-zwift
      WINEDEBUG: fixme-all

  installer:
    - task:
        name: create_prefix
        description: Create the Wine prefix with dw-proton
    - task:
        name: wineexec
        description: Install the Zwift launcher (the protonfix installs dotnet48 and WebView2 first)
        executable: setup
        args: /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOCANCEL
    - copy:
        src: zwiftstart
        dst: $GAMEDIR/drive_c/Program Files (x86)/Zwift
    - task:
        name: wineexec
        description: Download the game via the Zwift launcher
        executable: $GAMEDIR/drive_c/Program Files (x86)/Zwift/ZwiftStart.exe
        args: --update-only
        working_dir: $GAMEDIR/drive_c/Program Files (x86)/Zwift

notes: |
  Uses the Lutris Wine runner dw-proton (downloaded by Lutris if missing).
  Requires about 12 GB of free disk space. The installation downloads
  dotnet48, WebView2 and the complete game and takes 15-60 minutes.
  The Flatpak version of Lutris is not supported.

  ZwiftStart.exe (source: https://github.com/smoebody/lutris-zwift) checks
  the Zwift version before every start and updates if needed, sets fullscreen
  as default on first start and starts ZwiftApp.exe as a child process of the
  launcher. Log: drive_c/Program Files (x86)/Zwift/ZwiftStart.log.
  Log in directly in the game.
