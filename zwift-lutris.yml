name: Zwift
game_slug: zwift
version: Windows (dw-proton)
slug: zwift-dwproton
runner: wine

# Lutris startet dw-proton als Proton-Build ueber umu. Mit GAMEID umu-zwift
# fuehrt Proton beim ersten Aufruf den Protonfix fuer Zwift aus: Er setzt
# PROTON_DLL_COPY und installiert corefonts, dotnet48, d3dcompiler_47 und
# webview2. ZwiftStart.exe uebernimmt Update, Vollbild-Voreinstellung und den
# Start von ZwiftApp.exe als Kindprozess des Launchers.
script:
  files:
    - setup:
        url: https://cdn.zwift.com/app/ZwiftSetup.exe
        filename: ZwiftSetup.exe
        referer: https://www.zwift.com
    - zwiftstart:
        url: https://github.com/smoebody/lutris-zwift/releases/download/release/0.2.0/ZwiftStart.exe
        filename: ZwiftStart.exe
        checksum: sha256:b990b095a4f204c4a356fd212f87204dab5211eb6d1fb364d89af81345aa3c7a

  game:
    arch: win64
    prefix: $GAMEDIR
    exe: $GAMEDIR/drive_c/Program Files (x86)/Zwift/ZwiftStart.exe
    working_dir: $GAMEDIR/drive_c/Program Files (x86)/Zwift

  wine:
    version: dw-proton

  # Lutris 0.5.22 nimmt fuer wineexec-Schritte sonst die globale Wine-Vorgabe
  # (PROTONPATH=GE-Proton) und nach create_prefix PROTON_VERB=runinprefix, bei
  # dem der Protonfix uebersprungen wird. Gesetzte Werte ueberschreibt es nicht.
  system:
    env:
      PROTONPATH: $HOME/.local/share/lutris/runners/wine/dw-proton-x86_64
      PROTON_VERB: waitforexitandrun
      GAMEID: umu-zwift
      UMU_ID: umu-zwift
      WINEDEBUG: fixme-all

  installer:
    - task:
        name: create_prefix
        description: Wine-Praefix mit dw-proton anlegen
    - task:
        name: wineexec
        description: Zwift-Launcher installieren (vorher installiert der Protonfix dotnet48 und WebView2)
        executable: setup
        args: /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOCANCEL
    - copy:
        src: zwiftstart
        dst: $GAMEDIR/drive_c/Program Files (x86)/Zwift
    - task:
        name: wineexec
        description: Spiel ueber den Zwift-Launcher herunterladen
        executable: $GAMEDIR/drive_c/Program Files (x86)/Zwift/ZwiftStart.exe
        args: --update-only
        working_dir: $GAMEDIR/drive_c/Program Files (x86)/Zwift

notes: |
  Verwendet den Lutris-Wine-Runner dw-proton (wird bei Bedarf von Lutris
  geladen). Die Installation laedt dotnet48, WebView2 und das komplette Spiel
  (mehrere GB) herunter und dauert entsprechend.

  ZwiftStart.exe (Quelltext: https://github.com/smoebody/lutris-zwift) prueft
  vor jedem Start die Zwift-Version und aktualisiert bei Bedarf, stellt beim
  ersten Start Vollbild ein und startet ZwiftApp.exe als Kindprozess des
  Launchers. Protokoll: drive_c/Program Files (x86)/Zwift/ZwiftStart.log.
  Die Anmeldung erfolgt direkt im Spiel.
