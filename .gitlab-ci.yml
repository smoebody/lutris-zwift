stages:
  - build
  - package
  - publish

variables:
  MONO_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/mono:6.12
  ALPINE_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3
  # The dependency proxy only mirrors Docker Hub.
  GLAB_IMAGE: registry.gitlab.com/gitlab-org/cli:latest
  PACKAGE_NAME: zwiftstart
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/zwiftstart
  RELEASE_TAG_PATTERN: /^release\/\d+\.\d+\.\d+$/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^release\/\d+\.\d+\.\d+$/

default:
  tags:
    - docker
  interruptible: true

build:
  stage: build
  image: ${MONO_IMAGE}
  script:
    - mkdir -p build
    - mcs -platform:x64 -optimize+ -target:exe -out:build/ZwiftStart.exe ZwiftStart.cs
    # Ensure a PE32+ image for x86-64: "MZ", "PE\0\0", machine 0x8664, optional header magic 0x20b.
    - |
      exe=build/ZwiftStart.exe
      hex() { od -An -tx1 -j"$1" -N"$2" "$exe" | tr -d ' \n'; }
      pe_offset=$((0x$(od -An -tx4 -j60 -N4 "$exe" | tr -d ' ')))
      test "$(hex 0 2)" = 4d5a
      test "$(hex "$pe_offset" 4)" = 50450000
      test "$(hex $((pe_offset + 4)) 2)" = 6486
      test "$(hex $((pe_offset + 24)) 2)" = 0b02
    - (cd build && sha256sum ZwiftStart.exe > ZwiftStart.exe.sha256)
    - cat build/ZwiftStart.exe.sha256
  artifacts:
    expire_in: 1 month
    paths:
      - build/

.upload:
  stage: package
  image: ${MONO_IMAGE}
  needs: [build]
  variables:
    GIT_STRATEGY: none
  script:
    - |
      for file in ZwiftStart.exe ZwiftStart.exe.sha256; do
          curl --fail --silent --show-error \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --upload-file "build/${file}" \
              "${PACKAGE_URL}/${VERSION}/${file}"
          echo
      done

package_staging:
  extends: .upload
  variables:
    VERSION: staging
  resource_group: package-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

package_release:
  extends: .upload
  before_script:
    - export VERSION="${CI_COMMIT_TAG#release/}"
    - echo "VERSION=${VERSION}" > release.env
  artifacts:
    reports:
      dotenv: release.env
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN

release:
  stage: publish
  image: ${GLAB_IMAGE}
  needs: [package_release]
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Release ${VERSION} (${CI_COMMIT_TAG})"
  release:
    tag_name: $CI_COMMIT_TAG
    name: ZwiftStart $VERSION
    description: >-
      ZwiftStart.exe ${VERSION} für Zwift unter Lutris (dw-proton), übersetzt aus ${CI_COMMIT_SHORT_SHA}.
      Download auch über ${CI_PAGES_URL}/download/${VERSION}/
    assets:
      links:
        - name: ZwiftStart.exe
          url: ${CI_PAGES_URL}/download/${VERSION}/ZwiftStart.exe
          link_type: package
          direct_asset_path: /ZwiftStart.exe
        - name: ZwiftStart.exe.sha256
          url: ${CI_PAGES_URL}/download/${VERSION}/ZwiftStart.exe.sha256
          link_type: other
          direct_asset_path: /ZwiftStart.exe.sha256
        - name: ZwiftStart.exe (Paket-Registry)
          url: ${PACKAGE_URL}/${VERSION}/ZwiftStart.exe
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN

# Rebuilt from the package registry on every run, so the site always offers staging and the newest release.
pages:
  stage: publish
  image: ${ALPINE_IMAGE}
  needs:
    - job: package_staging
      optional: true
    - job: package_release
      optional: true
  resource_group: pages
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      set -eu
      fetch() {
          curl --fail --silent --show-error --location \
              --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
              --output "$2" "${PACKAGE_URL}/$1"
      }

      git fetch --quiet --force --tags origin
      latest_tag=$(git tag --list 'release/*' | grep -E '^release/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

      rm -rf public && cp -r public-src public

      staging_html='<p>Noch keine Staging-Version vorhanden.</p>'
      mkdir -p public/download/staging
      if fetch staging/ZwiftStart.exe public/download/staging/ZwiftStart.exe \
          && fetch staging/ZwiftStart.exe.sha256 public/download/staging/ZwiftStart.exe.sha256; then
          staging_sha=$(cut -d' ' -f1 public/download/staging/ZwiftStart.exe.sha256)
          staging_html="<p><a class=\"button\" href=\"download/staging/ZwiftStart.exe\">ZwiftStart.exe (staging)</a></p>
      <p class=\"meta\">Stand von <code>main</code>, SHA-256 <code>${staging_sha}</code> (<a href=\"download/staging/ZwiftStart.exe.sha256\">.sha256</a>)</p>"
      else
          rm -rf public/download/staging
      fi

      release_html='<p>Noch kein Release vorhanden.</p>'
      # Older releases (before ZwiftStart) have no matching package and are skipped.
      version=${latest_tag#release/}
      if [ -n "$latest_tag" ] && mkdir -p "public/download/${version}" \
          && fetch "${version}/ZwiftStart.exe" "public/download/${version}/ZwiftStart.exe" \
          && fetch "${version}/ZwiftStart.exe.sha256" "public/download/${version}/ZwiftStart.exe.sha256"; then
          cp -r "public/download/${version}" public/download/latest
          release_sha=$(cut -d' ' -f1 "public/download/${version}/ZwiftStart.exe.sha256")
          release_html="<p><a class=\"button\" href=\"download/latest/ZwiftStart.exe\">ZwiftStart.exe ${version}</a></p>
      <p class=\"meta\">Fester Link: <a href=\"download/${version}/ZwiftStart.exe\">download/${version}/ZwiftStart.exe</a>, SHA-256 <code>${release_sha}</code> (<a href=\"download/${version}/ZwiftStart.exe.sha256\">.sha256</a>)</p>"
      elif [ -n "$latest_tag" ]; then
          rm -rf "public/download/${version}"
      fi

      printf '%s\n' "$staging_html" > /tmp/staging.html
      printf '%s\n' "$release_html" > /tmp/release.html
      sed -i \
          -e '/@STAGING@/{r /tmp/staging.html' -e 'd}' \
          -e '/@RELEASE@/{r /tmp/release.html' -e 'd}' \
          -e "s|@COMMIT@|${CI_COMMIT_SHORT_SHA}|g" \
          -e "s|@DATE@|$(date -u '+%Y-%m-%d %H:%M UTC')|g" \
          -e "s|@PROJECT_URL@|${CI_PROJECT_URL}|g" \
          -e "s|@PROJECT_NOTE@| (Anmeldung erforderlich)|g" \
          public/index.html
      find public -type f | sort
  artifacts:
    expire_in: 1 week
    paths:
      - public
  environment:
    name: production
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ $RELEASE_TAG_PATTERN
